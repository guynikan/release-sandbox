name: Vulnerability scanning

# Sandbox no-op equivalent of the real conviso_cli.yml: same triggers, no container and no secret.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, proof/scan-new]

jobs:
  conviso-ast:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login != 'github-actions[bot]' &&
      !startsWith(github.head_ref, 'publish/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run AST (stand-in)
        run: echo "conviso ast run --vulnerability-auto-close (stand-in, no CONVISO_API_KEY in the sandbox)"
