name: App push probe
# Sandbox-only evidence: who can push to protected master, and is `workflows: write` needed.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: appc
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - id: appw
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pushes
        env:
          GT: ${{ github.token }}
          TC: ${{ steps.appc.outputs.token }}
          TW: ${{ steps.appw.outputs.token }}
        run: |
          git config user.name probe; git config user.email probe@example.invalid
          URL="https://x-access-token:%s@github.com/${GITHUB_REPOSITORY}.git"
          push() { git push "$(printf "$URL" "$1")" "$2" 2>&1 | sed -E 's#x-access-token:[^@]*@#x-access-token:***@#' | tail -4; echo "exit=${PIPESTATUS[0]}"; }
          echo "### 1. GITHUB_TOKEN -> master (expect rejected)"
          git checkout -q -B t1 origin/master; git commit -q --allow-empty -m "probe: github token push"
          push "$GT" HEAD:refs/heads/master
          echo "### 2. App token (contents:write) -> master (expect accepted, ff only)"
          git checkout -q -B t2 origin/master; git commit -q --allow-empty -m "probe: app push to master"
          push "$TC" HEAD:refs/heads/master
          echo "### 3. contents-only token, branch with a workflow file change"
          git checkout -q -B t3 origin/master; echo "# probe" > .github/workflows/zz-probe.yml; git add -A; git commit -q -m "probe: workflow file"
          push "$TC" HEAD:refs/heads/probe/workflow-contents-only
          echo "### 4. contents+workflows token, same commit"
          push "$TW" HEAD:refs/heads/probe/workflow-with-workflows
          git push "$(printf "$URL" "$TW")" :refs/heads/probe/workflow-with-workflows :refs/heads/probe/workflow-contents-only 2>&1 | tail -2 || true
