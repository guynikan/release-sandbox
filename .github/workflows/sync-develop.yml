name: Sync develop

# Push to `next-release`: merge `next-release` into `develop` with a real merge commit (no squash/rebase),
# pushed with GITHUB_TOKEN. `develop` is not protected, so no PR is needed. On conflict (or if the
# push is refused) the run fails visibly, nothing is forced, and a person merges next-release into develop.
# OFF until switch day: gated by the repo variable RELEASE_FLOW_ENABLED.
on:
  push:
    branches: [next-release]
  workflow_dispatch:

concurrency:
  group: sync-develop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    if: ${{ vars.RELEASE_FLOW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge next-release into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B develop origin/develop
          if git merge-base --is-ancestor origin/next-release HEAD; then
            echo "develop already contains next-release" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-ff origin/next-release -m "Merge next-release into develop"; then
            git merge --abort
            echo "::error::Merge conflict between next-release and develop. Nothing was pushed. A person must merge next-release into develop (locally, with a merge commit) and push."
            exit 1
          fi
          # Credentials only for this push (checkout runs with persist-credentials: false). Plain push, never forced.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          if ! ERR=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin develop 2>&1); then
            echo "$ERR"
            echo "::error::Push to develop was refused (${ERR%%$'\n'*}). A person must merge next-release into develop (merge commit) and push."
            exit 1
          fi
          echo "develop updated to $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
