name: Publish

# Push to master. Acts ONLY when the push is the merge of a PR from publish/* (release) or hotfix/*, and
# only when a tested draft exists for it: publishes that exact draft (restoreSiteDeploy, no rebuild) after
# checking that the master tree equals the tree recorded in deploy-state.json.
# - no draft (ordinary push, hotfix/* used as a plain work branch): green run, skipped, with a note;
# - a draft exists but master/branch differs from it: red run, nothing published.
# The decision lives in .github/scripts/release-flow (tested); this file only gathers facts and calls Netlify.
# OFF until switch day: gated by the repo variable RELEASE_FLOW_ENABLED.
on:
  push:
    branches: [master]

concurrency:
  group: production-publish
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  deployments: write

jobs:
  publish:
    if: ${{ vars.RELEASE_FLOW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # Production site (closeer-empresas-production). Not a secret: the variables only override the fallback.
      SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID || 'ecaf0137-9763-432e-8257-59cb5a828116' }}
      SITE_NAME: ${{ vars.NETLIFY_PRODUCTION_SITE || 'closeer-empresas-production' }}
      CLI: .github/scripts/release-flow/cli.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Which PR was merged as this commit? The lookup can lag right after the merge: retry a few times.
      - name: Is this push the merge of a publish/* or hotfix/* PR?
        id: pr
        run: |
          for _ in 1 2 3 4 5 6; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > prs.json || echo '[]' > prs.json
            jq -e --arg sha "$GITHUB_SHA" 'any(.[]; .merge_commit_sha == $sha)' prs.json >/dev/null && break
            sleep 5
          done
          node "$CLI" detect-pr < prs.json
      - name: Find the draft (tag and deploy-state.json)
        id: find
        if: steps.pr.outputs.act == 'true'
        env:
          KIND: ${{ steps.pr.outputs.kind }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          VERSION: ${{ steps.pr.outputs.version }}
        run: |
          DRAFT_TAG=""
          STALE_TAG=""
          if [ "$KIND" = publish ]; then
            # The release tag has no "v" (include-v-in-tag: false).
            DRAFT_TAG=$(git tag -l "$VERSION" | head -n1)
          else
            # The hotfix draft tags the exact head commit of the branch. hotfix/* is also the name of ordinary
            # work branches, so the prefix decides nothing: publishing needs a draft made by hotfix-draft for
            # exactly this head. A branch that changed after the draft has no tag on its head.
            DRAFT_TAG=$(git tag --points-at "$HEAD_SHA" | grep '^hotfix-' | head -n1 || true)
            if [ -z "$DRAFT_TAG" ]; then
              STALE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                | jq -r --arg n "$PR_NUMBER" '[.[] | select((.tag_name | startswith("hotfix-")) and (.body // "" | contains("/pull/" + $n + ")")))][0].tag_name // empty')
            fi
          fi
          STATE_FILE=""
          TAG_COMMIT=""
          TAG_TREE=""
          if [ -n "$DRAFT_TAG" ]; then
            TAG_COMMIT=$(git rev-list -n1 "refs/tags/$DRAFT_TAG")
            TAG_TREE=$(git rev-parse "refs/tags/$DRAFT_TAG^{tree}")
            if gh release download "$DRAFT_TAG" --pattern deploy-state.json --repo "$GITHUB_REPOSITORY" --clobber; then
              STATE_FILE=deploy-state.json
            fi
          fi
          {
            echo "draft_tag=$DRAFT_TAG"
            echo "stale_tag=$STALE_TAG"
            echo "state_file=$STATE_FILE"
            echo "tag_commit=$TAG_COMMIT"
            echo "tag_tree=$TAG_TREE"
          } >> "$GITHUB_OUTPUT"
      - name: Decide (draft exists and master tree equals the draft tree)
        id: decide
        if: steps.pr.outputs.act == 'true'
        env:
          KIND: ${{ steps.pr.outputs.kind }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          DRAFT_TAG: ${{ steps.find.outputs.draft_tag }}
          STALE_TAG: ${{ steps.find.outputs.stale_tag }}
          STATE_FILE: ${{ steps.find.outputs.state_file }}
          TAG_COMMIT: ${{ steps.find.outputs.tag_commit }}
          TAG_TREE: ${{ steps.find.outputs.tag_tree }}
        run: |
          MASTER_TREE=$(git rev-parse "$GITHUB_SHA^{tree}") node "$CLI" decide-publish
      - name: Publish the draft (restoreSiteDeploy, lock kept)
        if: steps.decide.outputs.action == 'publish'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          DRAFT: ${{ steps.decide.outputs.draft }}
        run: |
          API=https://api.netlify.com/api/v1
          H="Authorization: Bearer $NETLIFY_AUTH_TOKEN"
          PREVIOUS=$(curl -fsS -H "$H" "$API/sites/$SITE_ID" | jq -r '.published_deploy.id')
          curl -fsS -X POST -H "$H" "$API/sites/$SITE_ID/deploys/$DRAFT/restore" | jq '{id, state, published_at}'
          for _ in $(seq 1 12); do
            CUR=$(curl -fsS -H "$H" "$API/sites/$SITE_ID" | jq -r '[.published_deploy.id, .published_deploy.locked] | @tsv')
            [ "${CUR%%$'\t'*}" = "$DRAFT" ] && break
            sleep 3
          done
          [ "${CUR%%$'\t'*}" = "$DRAFT" ] || { echo "::error::Published deploy is not the draft after restore ($CUR)"; exit 1; }
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
          {
            echo "### Published $TAG"
            echo "- published deploy: \`$PREVIOUS\` -> \`$DRAFT\` (locked: ${CUR##*$'\t'})"
            echo "- https://$SITE_NAME.netlify.app"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Record the GitHub Deployment (production)
        if: steps.decide.outputs.action == 'publish'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          DRAFT: ${{ steps.decide.outputs.draft }}
        run: |
          PAYLOAD=$(jq -cn --arg d "$DRAFT" --arg p "$PREVIOUS" --arg t "$TAG" '{deployId:$d, previousDeployId:$p, tag:$t}')
          DID=$(jq -n --arg ref "$GITHUB_SHA" --arg desc "Publish $TAG" --argjson payload "$PAYLOAD" \
            '{ref:$ref, environment:"production", auto_merge:false, required_contexts:[], description:$desc, payload:$payload}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          jq -n --arg url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg env "https://$SITE_NAME.netlify.app" \
            '{state:"success", environment:"production", log_url:$url, environment_url:$env, description:"Published"}' \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$DID/statuses" --input - >/dev/null
          echo "- GitHub Deployment \`$DID\` recorded (production, success)" >> "$GITHUB_STEP_SUMMARY"
