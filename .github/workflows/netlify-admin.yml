name: Netlify admin
# Sandbox-only generic Netlify API caller (non-secret paths/bodies). Output filtered by jq.
on:
  workflow_dispatch:
    inputs:
      method:
        default: GET
      path:
        description: API path after /api/v1 (use SITE_PRODUCTION/SITE_STAGING/SITE_PREVIEW placeholders)
      body:
        default: ''
      filter:
        default: '.'
permissions:
  contents: read
jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      METHOD: ${{ inputs.method }}
      P: ${{ inputs.path }}
      BODY: ${{ inputs.body }}
      FILTER: ${{ inputs.filter }}
      SP: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}
      SS: ${{ vars.NETLIFY_STAGING_SITE_ID }}
      SV: ${{ vars.NETLIFY_PREVIEW_SITE_ID }}
    steps:
      - run: |
          P=${P//SITE_PRODUCTION/$SP}; P=${P//SITE_STAGING/$SS}; P=${P//SITE_PREVIEW/$SV}
          case "$METHOD" in GET|POST|PATCH|PUT) ;; *) echo "method not allowed"; exit 1;; esac
          # allowlist: only the 3 sandbox sites and deploys; no encoding, globs, traversal or hooks
          [[ "$P" =~ ^(accounts|accounts/[0-9a-f]{24}|sites/[0-9a-f-]{36}(/(deploys|builds|env|service-instances))?|deploys/[0-9a-f]{24}(/(lock|unlock|restore|cancel|files))?|sites/[0-9a-f-]{36}/deploys/[0-9a-f]{24}(/restore)?)(\?[a-z_=0-9&]*)?$ ]] || { echo "path not allowed"; exit 1; }
          case "$P" in *%*|*..*|*build_hooks*) echo "path not allowed"; exit 1;; esac
          SITEID=${P#sites/}; SITEID=${SITEID:0:36}
          if [[ "$P" == sites/* ]]; then case "$SITEID" in "$SP"|"$SS"|"$SV") ;; *) echo "site not allowed"; exit 1;; esac; fi
          umask 077; printf 'header = "Authorization: Bearer %s"\n' "$NETLIFY_AUTH_TOKEN" > "$RUNNER_TEMP/curlrc"
          ARGS=(-g -sS -X "$METHOD" -K "$RUNNER_TEMP/curlrc" -H 'Content-Type: application/json')
          [ -n "$BODY" ] && ARGS+=(-d "$BODY")
          curl "${ARGS[@]}" "https://api.netlify.com/api/v1/$P" > "$RUNNER_TEMP/out.json"
          rm -f "$RUNNER_TEMP/curlrc"
          # jq runs with an empty environment so a filter cannot read the token
          env -i "$(command -v jq)" "$FILTER" "$RUNNER_TEMP/out.json"
