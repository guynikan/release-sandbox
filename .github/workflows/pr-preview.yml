name: PR preview

# Asks Netlify (site `empresas-preview`) to build the PR branch and comments the fixed branch URL.
#
# OPT-IN: a preview is generated only when the PR has the `preview` label (put it when the card goes
# to QA). Even with the label, it is skipped when the PR changes only non-app files (see
# NON_APP_PATTERNS below) or when the head branch is a long-lived one (master/develop/staging/main/release*).
# Skips only log a notice; they never comment. Removing the label leaves the old comment untouched
# (the cleanup workflow handles deploys on close).
#
# SECURITY: `pull_request_target` runs the workflow definition from the base branch and exposes
# secrets, so this workflow must NEVER check out or execute PR code. It only reads PR metadata,
# and passes it to the shell through env vars (never interpolated into scripts).
on:
  pull_request_target:
    types: [opened, labeled, synchronize, reopened, ready_for_review]

concurrency:
  # Unrelated labels get their own group so they never cancel an in-flight preview run.
  group: pr-preview-${{ github.event.pull_request.number }}${{ (github.event.action == 'labeled' && github.event.label.name != 'preview') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # comment (also covers reading the PR files list)

jobs:
  preview:
    # Skip forks and drafts. Require the `preview` label (on `labeled`, only when it is the label just added).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview') &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Build hook URL of `empresas-preview` (a secret; it can only trigger builds of that site).
      # The Netlify API token is deliberately NOT available to this job.
      HOOK_URL: ${{ secrets.NETLIFY_PREVIEW_HOOK_URL }}
      PREVIEW_SITE_NAME: empresas-preview
      BRANCH: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Decide whether to build a preview
        id: gate
        run: |
          set -euo pipefail
          if [ -z "$HOOK_URL" ]; then
            echo "::notice::NETLIFY_PREVIEW_HOOK_URL secret not set; skipping preview."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Safety net B: never build long-lived branches.
          case "$BRANCH" in
            master|develop|staging|main|release*)
              echo "::notice::Head branch '$BRANCH' is a long-lived branch; skipping preview."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Safety net A: skip when the PR touches only non-app files.
          # Bash `case` globs: `*` also matches `/`, so `*.md` means "any .md at any depth".
          # Anything NOT matched here (src/, public/, package.json, yarn.lock, craco.config.js,
          # netlify.toml, .env*, ...) counts as an app file and enables the preview.
          NON_APP_PATTERNS=(
            '.github/*'
            '*.md'
            'docs/*'
            'scripts/*'
            '__tests__/*'
            '*/__tests__/*'
            '*.test.js'
            '*.spec.js'
            '.husky/*'
            '.vscode/*'
            '.gitignore'
            '.editorconfig'
            'LICENSE'
          )
          # Metadata only (no checkout). Renames also report the previous path.
          FILES=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          HAS_APP_FILE=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            is_non_app=false
            for pattern in "${NON_APP_PATTERNS[@]}"; do
              # shellcheck disable=SC2254
              case "$f" in
                $pattern) is_non_app=true; break ;;
              esac
            done
            if [ "$is_non_app" = false ]; then
              HAS_APP_FILE=true
              break
            fi
          done <<< "$FILES"
          if [ "$HAS_APP_FILE" = false ]; then
            echo "::notice::PR #${PR_NUMBER} changes only non-app files; skipping preview."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the Netlify build hook
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          # The hook URL is a secret and is already masked by GitHub; mask again defensively.
          echo "::add-mask::$HOOK_URL"
          BRANCH_Q=$(jq -rn --arg v "$BRANCH" '$v | @uri')
          TITLE_Q=$(jq -rn --arg v "PR #${PR_NUMBER} ${SHA:0:7}" '$v | @uri')
          # Fire and forget: the build runs on Netlify and failures are announced there.
          curl -fsS -o /dev/null -X POST -d '{}' \
            "${HOOK_URL}?trigger_branch=${BRANCH_Q}&trigger_title=${TITLE_Q}"
          echo "Build hook triggered for PR #${PR_NUMBER} (${SHA:0:7})."

      - name: Comment the preview URL on the PR
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          MARKER='<!-- pr-preview-empresas -->'
          # BEST EFFORT: approximates Netlify's branch slug (the API is not queried, since this job has no token): lowercase, anything outside [a-z0-9-] becomes "-".
          SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')
          LABEL="${SLUG}--${PREVIEW_SITE_NAME}"
          URL="https://${LABEL}.netlify.app"
          WARNING=""
          if [ "${#LABEL}" -gt 63 ]; then
            WARNING=$'\n\n> ⚠️ O nome da branch é longo demais: o subdomínio tem '"${#LABEL}"$' caracteres (limite de DNS: 63), então o Netlify pode gerar uma URL diferente desta ou não gerar o link. Use um nome de branch mais curto.'
          fi
          BODY="${MARKER}"$'\n'"### 🔎 Preview"$'\n\n'"**Link:** ${URL}"$'\n'"**Commit:** \`${SHA}\`"$'\n\n'"O build leva alguns minutos; até terminar, o link mostra o build anterior ou 404. O conteúdo muda a cada novo commit da branch. Se o build falhar, o aviso vem pelo Netlify no Slack. O link é calculado a partir do nome da branch (melhor esforço); se não abrir, confira o deploy no painel do Netlify."
          BODY="${BODY}${WARNING}"
          # Only our own bot comment is updated (a user quoting the marker must not be patched).
          COMMENT_ID=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\")))][0].id // empty" \
            | sed -n '1p')
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" > /dev/null
          fi
