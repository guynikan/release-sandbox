name: Hotfix draft

# Guardian-triggered for a hotfix PR (base master, head hotfix/*). Updates the branch with master when it is
# behind, squashes it into ONE commit `hotfix(KEY): ...` (a type release-please ignores, so the hotfix never
# lands in the next changelog) plus a patch bump commit (package.json + .release-please-manifest.json) with a
# non-conventional message, renames the PR to `hotfix(KEY): ...`, builds the head with the production settings
# of the Netlify site and uploads it as the draft on pre-producao. Then it creates the tag `hotfix-X.Y.Z`
# (deliberately NOT semver) with a GitHub Release carrying deploy-state.json, and the plain tag `X.Y.Z` on the
# previous release commit (the one the manifest on master cited), so release-please keeps its anchor.
# The guardian smoke tests the draft and merges the PR with a MERGE COMMIT; publish.yml publishes.
# A hotfix that changes .github/workflows/* cannot be pushed with GITHUB_TOKEN: it fails early with a message
# and the guardian merges that PR by hand.
# OFF until switch day: gated by the repo variable RELEASE_FLOW_ENABLED.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Hotfix PR number
        required: true

concurrency:
  group: hotfix-draft
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  hotfix-draft:
    if: ${{ vars.RELEASE_FLOW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PR: ${{ inputs.pr }}
      # Production site (closeer-empresas-production). Not a secret: the variables only override the fallback.
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID || 'ecaf0137-9763-432e-8257-59cb5a828116' }}
      SITE_NAME: ${{ vars.NETLIFY_PRODUCTION_SITE || 'closeer-empresas-production' }}
      NETLIFY_CLI_VERSION: "23.15.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scripts are copied out of the workspace: the next steps switch it to the hotfix branch.
      - name: Keep the flow scripts
        run: cp -r .github/scripts/release-flow "$RUNNER_TEMP/release-flow"
      - name: Verify the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::PR must be a number"; exit 1; }
          gh pr view "$PR" --json state,baseRefName,headRefName,title,url,isCrossRepository > pr.json
          jq -r '"PR \(.url): base=\(.baseRefName) head=\(.headRefName) state=\(.state)"' pr.json
          [ "$(jq -r .state pr.json)" = "OPEN" ] || { echo "::error::PR is not open"; exit 1; }
          [ "$(jq -r .baseRefName pr.json)" = "master" ] || { echo "::error::PR base must be master"; exit 1; }
          [ "$(jq -r .isCrossRepository pr.json)" = "false" ] || { echo "::error::Fork PRs are not supported"; exit 1; }
          HEAD=$(jq -r .headRefName pr.json)
          [[ "$HEAD" =~ ^hotfix/[A-Za-z0-9._-]+$ ]] || { echo "::error::Head branch must be hotfix/<name> (letters, digits, . _ -)"; exit 1; }
          {
            echo "HEAD_REF=$HEAD"
            echo "PR_TITLE=$(jq -r .title pr.json | tr -d '\r\n')"
            echo "PR_URL=$(jq -r .url pr.json)"
          } >> "$GITHUB_ENV"
      - name: Refuse a PR that changes .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' \
            | node "$RUNNER_TEMP/release-flow/cli.js" workflow-files
      - name: Plan the version, the tags and the title
        id: plan
        run: |
          PACKAGE_VERSION=$(git show origin/master:package.json | jq -r .version) \
          MANIFEST_VERSION=$(git show origin/master:.release-please-manifest.json | jq -r '.["."]') \
          TAGS=$(git tag -l) \
            node "$RUNNER_TEMP/release-flow/cli.js" hotfix-plan
          ANCHOR_TAG=$(sed -n 's/^anchor_tag=//p' "$GITHUB_OUTPUT")
          echo "anchor_sha=$(git rev-list -n1 "refs/tags/$ANCHOR_TAG")" >> "$GITHUB_OUTPUT"
      - name: Update with master, squash into hotfix(KEY) and add the patch bump commit
        id: squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.plan.outputs.next }}
          NEW_TITLE: ${{ steps.plan.outputs.new_title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ORIG_SHA=$(git rev-parse "origin/$HEAD_REF")
          PR="$PR" CLI="$RUNNER_TEMP/release-flow/cli.js" "$RUNNER_TEMP/release-flow/squash-hotfix.sh"
          # Credentials only for this push (checkout runs with persist-credentials: false). Never a plain --force.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          if ! ERR=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push --force-with-lease="refs/heads/$HEAD_REF:$ORIG_SHA" origin "HEAD:refs/heads/$HEAD_REF" 2>&1); then
            echo "$ERR"
            echo "::error::Push to $HEAD_REF was refused (${ERR%%$'\n'*}). If the branch changed meanwhile, run hotfix-draft again."
            exit 1
          fi
          # The PR title becomes the body of the merge commit: keep it out of the next changelog too.
          gh pr edit "$PR" --title "$NEW_TITLE"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      # Install scripts are kept on purpose (@bugsnag/cli fetches its binary in a postinstall); no token in this step.
      - run: yarn install --frozen-lockfile
      # Command from the Netlify site settings, variables from the production context of the site (see release-please.yml).
      - name: Build with the production settings of the Netlify site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" build --context production 2>&1 | tee build.log
          test -f build/index.html || { echo "::error::build/index.html is missing: the Netlify build did not run a build command (is the command set in the site settings?)"; exit 1; }
      - name: Deploy the draft on pre-producao, tag it and keep the changelog anchor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NEXT: ${{ steps.plan.outputs.next }}
          TAG: ${{ steps.plan.outputs.tag }}
          PLAIN_TAG: ${{ steps.plan.outputs.plain_tag }}
          ANCHOR_SHA: ${{ steps.plan.outputs.anchor_sha }}
          COMMIT: ${{ steps.squash.outputs.commit }}
          TREE: ${{ steps.squash.outputs.tree }}
        run: |
          API=https://api.netlify.com/api/v1
          PREVIOUS=$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$API/sites/$NETLIFY_SITE_ID" | jq -r '.published_deploy.id')
          npx --yes "netlify-cli@$NETLIFY_CLI_VERSION" deploy --no-build --dir build --site "$NETLIFY_SITE_ID" --alias pre-producao --json > deploy.json
          DRAFT=$(jq -r '.deploy_id' deploy.json)
          [ -n "$DRAFT" ] && [ "$DRAFT" != null ] || { echo "::error::Netlify did not return a deploy id"; exit 1; }
          KIND=hotfix VERSION="$NEXT" DRAFT_DEPLOY_ID="$DRAFT" PREVIOUS_DEPLOY_ID="$PREVIOUS" SITE_ID="$NETLIFY_SITE_ID" \
            node "$RUNNER_TEMP/release-flow/cli.js" deploy-state
          cat deploy-state.json
          # The notes keep "<PR url>)" : publish.yml uses it to recognise a draft whose branch changed afterwards.
          # --latest=false: a hotfix draft may never be published, so it must not become the "Latest" release.
          gh release create "$TAG" deploy-state.json --target "$COMMIT" --title "$TAG" --latest=false \
            --notes "Hotfix $NEXT: $PR_TITLE ($PR_URL). Draft deploy $DRAFT."
          # Plain tag on the previous release commit, not on the hotfix: release-please looks for the tag named
          # like the manifest version, and a tag on the hotfix commit would hide PRs already merged on next-release.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$PLAIN_TAG" -f sha="$ANCHOR_SHA" >/dev/null
          {
            echo "### Hotfix draft $TAG"
            echo "- plain tag \`$PLAIN_TAG\` -> \`${ANCHOR_SHA:0:7}\` (changelog anchor of the previous release, not the hotfix)"
            echo "- draft deploy: \`$DRAFT\` (published today: \`$PREVIOUS\`)"
            echo "- alias: https://pre-producao--$SITE_NAME.netlify.app"
            echo "- permalink: https://$DRAFT--$SITE_NAME.netlify.app"
            echo "- commit \`$COMMIT\`, tree \`$TREE\`"
            echo "- smoke test, then merge $PR_URL with a **merge commit**"
            echo "- after a rollback, master is ahead of production: this hotfix republishes what was rolled back"
          } >> "$GITHUB_STEP_SUMMARY"
