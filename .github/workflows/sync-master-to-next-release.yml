name: Sync master into next-release

# Push to `master`: open (or reuse) a PR master -> next-release and merge it with a real merge commit.
# When the merge is refused (conflict, workflow-file restriction, branch rule) the PR stays open with
# a comment and the run fails; a person then merges it (that merge triggers the downstream workflows).
# Merges made with GITHUB_TOKEN do not trigger other workflows, so after a successful automatic sync
# the next-release workflows are dispatched explicitly (workflow_dispatch is the documented exception).
# OFF until switch day: gated by the repo variable RELEASE_FLOW_ENABLED.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-master-to-next-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    if: ${{ vars.RELEASE_FLOW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sync master into next-release
        id: sync
        run: .github/scripts/sync-pr.sh next-release master "Sync master into next-release"
      # The merge above was made with GITHUB_TOKEN, so its push to next-release triggers nothing.
      - name: Dispatch the next-release workflows
        if: steps.sync.outputs.merged == 'true'
        run: |
          failed=0
          for W in release-please.yml sync-develop.yml; do
            gh workflow run "$W" --repo "$GITHUB_REPOSITORY" --ref next-release || failed=1
          done
          exit "$failed"
