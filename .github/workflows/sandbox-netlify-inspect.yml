name: Sandbox Netlify inspect

# Sandbox-only, READ-ONLY helper: prints what the production Netlify site serves (ids and hashes only).
on:
  workflow_dispatch:
    inputs:
      deploy_id:
        description: "Also describe this deploy id (optional)"
        required: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}
      EXTRA: ${{ inputs.deploy_id }}
    steps:
      - name: Describe the production site
        run: |
          API=https://api.netlify.com/api/v1
          H="Authorization: Bearer $NETLIFY_AUTH_TOKEN"
          get() { curl -fsS -H "$H" "$API/$1"; }
          describe() {
            ID="$1"
            get "sites/$SITE_ID/deploys/$ID" | jq -r '"deploy \(.id) state=\(.state) context=\(.context) branch=\(.branch) title=\(.title) commit_ref=\(.commit_ref) created=\(.created_at) published=\(.published_at) locked=\(.locked)"'
            echo "  index.html sha1: $(get "deploys/$ID/files" | jq -r '.[] | select(.id=="/index.html") | .sha')"
          }
          SITE=$(get "sites/$SITE_ID")
          PUB=$(jq -r '.published_deploy.id' <<<"$SITE")
          {
            echo "### Production site"
            echo '```'
            echo "published deploy: $PUB (locked=$(jq -r '.published_deploy.locked' <<<"$SITE"))"
            describe "$PUB"
            echo "--- pre-producao alias (latest deploy of branch pre-producao)"
            ALIAS=$(get "sites/$SITE_ID/deploys?branch=pre-producao&per_page=1" | jq -r '.[0].id')
            describe "$ALIAS"
            [ -n "$EXTRA" ] && { echo "--- requested deploy"; describe "$EXTRA"; }
            echo "--- last 8 deploys"
            get "sites/$SITE_ID/deploys?per_page=8" | jq -r '.[] | "\(.id) \(.state) ctx=\(.context) branch=\(.branch) created=\(.created_at) published=\(.published_at)"'
            echo "--- env vars (REACT_APP_* only)"
            ACC=$(jq -r '.account_id' <<<"$SITE")
            get "accounts/$ACC/env?site_id=$SITE_ID" | jq -r '.[] | select(.key|startswith("REACT_APP_")) | "\(.key) scopes=\(.scopes|join(",")) values=\([.values[]|"\(.context)=\(if .value==null then "(hidden)" else .value end)"]|join(" "))"'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
