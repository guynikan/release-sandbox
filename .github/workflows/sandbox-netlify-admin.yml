name: Sandbox Netlify admin

# Sandbox-only helper with a FIXED allowlist of actions on the sandbox sites (no free-form API calls).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "staging-branch | production-env"
        required: true
        type: choice
        options: [staging-branch, production-env]
      value:
        description: "staging-branch: branch name; production-env: KEY=VALUE (key must start with REACT_APP_)"
        required: true

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      STAGING_ID: ${{ vars.NETLIFY_STAGING_SITE_ID }}
      PROD_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}
      ACTION: ${{ inputs.action }}
      VALUE: ${{ inputs.value }}
    steps:
      - name: Run the allowed action
        run: |
          API=https://api.netlify.com/api/v1
          H="Authorization: Bearer $NETLIFY_AUTH_TOKEN"
          case "$ACTION" in
            staging-branch)
              [[ "$VALUE" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad branch"; exit 1; }
              BODY=$(curl -fsS -H "$H" "$API/sites/$STAGING_ID" | jq --arg b "$VALUE" '{repo: (.build_settings | .repo_branch=$b)}')
              curl -sS -X PATCH -H "$H" -H 'Content-Type: application/json' "$API/sites/$STAGING_ID" -d "$BODY" \
                | jq '{name, repo_branch: .build_settings.repo_branch, message}' | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            production-env)
              KEY="${VALUE%%=*}"; VAL="${VALUE#*=}"
              [[ "$KEY" =~ ^REACT_APP_[A-Z_]+$ ]] || { echo "::error::key must be REACT_APP_*"; exit 1; }
              ACC=$(curl -fsS -H "$H" "$API/sites/$PROD_ID" | jq -r .account_id)
              BODY=$(jq -n --arg k "$KEY" --arg v "$VAL" '[{key:$k, scopes:["builds","functions","runtime","post_processing"], values:[{context:"all", value:$v}]}]')
              curl -sS -X POST -H "$H" -H 'Content-Type: application/json' "$API/accounts/$ACC/env?site_id=$PROD_ID" -d "$BODY" | jq 'if type=="array" then map({key}) else . end' | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
          esac
