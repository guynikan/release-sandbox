name: Release Please
on:
  push:
    branches: [release]
  workflow_dispatch:
concurrency:
  group: release-please
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # App token: the tag/release and the release PR it creates trigger workflows normally.
          token: ${{ steps.app.outputs.token }}
          target-branch: release
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Legacy path, unused with the App token (the published release triggers production-draft).
      - name: Dispatch the production draft
        if: ${{ steps.rp.outputs.release_created == 'true' && vars.DISPATCH_CHAIN == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run production-draft.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
      - name: Note when nothing was dispatched
        if: ${{ steps.rp.outputs.release_created == 'true' && vars.DISPATCH_CHAIN != 'true' }}
        run: |
          echo "Release ${{ steps.rp.outputs.tag_name }} created; production-draft NOT dispatched (DISPATCH_CHAIN off)." >> "$GITHUB_STEP_SUMMARY"
