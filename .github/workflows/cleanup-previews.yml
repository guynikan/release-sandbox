name: Cleanup previews
# PR closed: delete the preview deploys of that branch via the Netlify API.
on:
  pull_request:
    types: [closed]
    branches: [release, master]
concurrency:
  group: cleanup-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  netlify-cleanup:
    if: ${{ vars.NETLIFY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRANCH: ${{ github.head_ref }}
      SITE_ID: ${{ vars.NETLIFY_PREVIEW_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Delete preview deploys of the branch
        run: |
          API=https://api.netlify.com/api/v1
          PUBLISHED=$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$API/sites/$SITE_ID" | jq -r '.published_deploy.id // empty')
          IDS=$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "$API/sites/$SITE_ID/deploys?branch=$(jq -rn --arg b "$BRANCH" '$b|@uri')&per_page=100" | jq -r '.[].id')
          for ID in $IDS; do
            if [ "$ID" = "$PUBLISHED" ]; then echo "skip published deploy $ID"; continue; fi
            curl -fsS -X DELETE -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$API/deploys/$ID" && echo "deleted $ID"
          done
  simulated-cleanup:
    if: ${{ vars.NETLIFY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "### Cleanup previews (simulated, Netlify disabled)" >> "$GITHUB_STEP_SUMMARY"
